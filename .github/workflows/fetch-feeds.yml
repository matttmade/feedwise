name: Fetch feeds

# Every 2 hours (GitHub may start scheduled runs a few minutes late). Also runnable by hand.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the fetch route
        env:
          APP_URL: ${{ secrets.FEEDWISE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            # Not deployed yet: say so without failing (and emailing) every two hours.
            echo "::notice::Skipped: set FEEDWISE_APP_URL and CRON_SECRET in the repo's Actions secrets."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/fetch"
